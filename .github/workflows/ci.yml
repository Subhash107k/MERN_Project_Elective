name: 18-Day MERN Course CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Setup Node.js Environment (v18)
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Test Backend API & Services
        run: |
          cd backend
          npm install
          npm test

      - name: Test & Build Frontend Bundle
        run: |
          cd frontend
          npm install
          npm test
          npm run build
